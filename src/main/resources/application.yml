server:
  port: 8080

spring:
  application:
    name: ims-gateway-ms
  datasource:
    url: jdbc:postgresql://localhost:5432/ims-common-db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

jwt:
  secret: ims-secret-key-for-gateway-service-should-be-long-enough
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 604800000

integration:
  services:
    student:
      url: http://localhost:8081
    teacher:
      url: http://localhost:8082
    admin:
      url: http://localhost:8083

