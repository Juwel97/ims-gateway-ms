spring:
  datasource:
    url: jdbc:h2:mem:ims_gateway_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  secret: test-secret-key-for-gateway-service-should-be-long-enough
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 604800000
